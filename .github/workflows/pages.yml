name: Publish Zettelhaufen

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Restore thumbnail lookups
        uses: actions/cache/restore@v5
        with:
          path: .thumbnail-cache
          key: thumbnail-lookups-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: thumbnail-lookups-v1-
      - run: npm run build
      - name: Save thumbnail lookups
        uses: actions/cache/save@v5
        with:
          path: .thumbnail-cache
          key: thumbnail-lookups-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
